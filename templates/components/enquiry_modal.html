<!-- ============================================================
   Sathik Groups — Global Quick Enquiry Floating Button & Modal
   ============================================================ -->

<!-- Floating Action Button (FAB) -->
<button type="button" id="quick-enquiry-fab" class="quick-enquiry-fab" onclick="openModal('quick-enquiry-modal')" aria-label="Quick Enquiry">
  <span class="fab-icon">📩</span>
  <span class="fab-text">Quick Enquiry</span>
</button>

<!-- Quick Enquiry Centered Modal Popup -->
<div id="quick-enquiry-modal" class="modal-backdrop quick-enquiry-backdrop">
  <div class="modal-card quick-enquiry-card">
    <div class="modal-header quick-enquiry-header">
      <div>
        <h3 class="quick-enquiry-title">Request a Quote</h3>
        <p class="quick-enquiry-subtitle">Tell us your requirements and our team will contact you shortly.</p>
      </div>
      <button type="button" class="modal-close-btn" onclick="closeModal('quick-enquiry-modal')" aria-label="Close">&times;</button>
    </div>

    <div class="modal-body quick-enquiry-body">
      <form id="quick-enquiry-form" onsubmit="handleQuickEnquirySubmit(event, this)" novalidate>
        <div class="form-alert" style="display:none;"></div>
        <input type="hidden" name="type" value="quick_enquiry">
        <input type="hidden" name="source" value="floating_fab">

        <!-- 1. Customer Name * -->
        <div class="form-group">
          <label class="form-label" for="qe-name">Customer Name <span class="required-star">*</span></label>
          <input type="text" id="qe-name" name="name" class="form-input" placeholder="Enter your name" required autocomplete="name">
          <div class="field-error" id="qe-name-error"></div>
        </div>

        <!-- 2. Mobile Number * -->
        <div class="form-group">
          <label class="form-label" for="qe-phone">Mobile Number <span class="required-star">*</span></label>
          <input type="tel" id="qe-phone" name="phone" class="form-input" placeholder="Enter mobile number" required inputmode="numeric" autocomplete="tel">
          <div class="field-error" id="qe-phone-error"></div>
        </div>

        <!-- 3. Email Address (Optional) -->
        <div class="form-group">
          <label class="form-label" for="qe-email">Email Address <span class="optional-tag">(Optional)</span></label>
          <input type="email" id="qe-email" name="email" class="form-input" placeholder="Enter your email" autocomplete="email">
          <div class="field-error" id="qe-email-error"></div>
        </div>

        <!-- 4. Address (Optional) -->
        <div class="form-group">
          <label class="form-label" for="qe-address">Address <span class="optional-tag">(Optional)</span></label>
          <textarea id="qe-address" name="city" class="form-textarea" placeholder="City / Site Address" rows="2"></textarea>
        </div>

        <!-- 5. Product Category (Dropdown, Optional) -->
        <div class="form-group">
          <label class="form-label" for="qe-category">Product Category <span class="optional-tag">(Optional)</span></label>
          <select id="qe-category" name="category" class="form-select">
            <option value="">Select Category</option>
            <option value="Plumbing and Industrial materials">Plumbing and Industrial materials</option>
            <option value="Paints,Hardwares and doorfittings">Paints,Hardwares and doorfittings</option>
            <option value="Bath and sanitaryware">Bath and sanitaryware</option>
            <option value="General Enquiry">General Enquiry</option>
          </select>
        </div>

        <!-- 6. Product Name (Optional) -->
        <div class="form-group">
          <label class="form-label" for="qe-product-name">Product Name <span class="optional-tag">(Optional)</span></label>
          <input type="text" id="qe-product-name" name="product_name" class="form-input" placeholder="Example: Jaquar Basin Mixer">
        </div>

        <!-- 7. Preferred Contact Method (Radio Buttons, Default: WhatsApp Message) -->
        <div class="form-group">
          <label class="form-label">Preferred Contact Method</label>
          <div class="contact-method-radios">
            <label class="radio-card">
              <input type="radio" name="preferred_contact" value="Phone Call">
              <span class="radio-custom"></span>
              <span class="radio-text">📞 Phone Call</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="preferred_contact" value="WhatsApp Message" checked>
              <span class="radio-custom"></span>
              <span class="radio-text">💬 WhatsApp Message</span>
            </label>
          </div>
        </div>

        <!-- 8. Additional Message (Optional) -->
        <div class="form-group">
          <label class="form-label" for="qe-message">Additional Message <span class="optional-tag">(Optional)</span></label>
          <textarea id="qe-message" name="message" class="form-textarea" placeholder="Tell us about your requirements..." rows="3"></textarea>
        </div>

        <!-- Form Buttons -->
        <div class="form-actions-row">
          <button type="submit" id="qe-submit-btn" class="btn btn-primary btn-block" disabled>
            <span class="btn-spinner" style="display:none;"></span>
            <span class="btn-label">Submit Enquiry</span>
          </button>
          <button type="button" class="btn btn-outline btn-block" onclick="closeModal('quick-enquiry-modal')">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Success Popup Modal -->
<div id="quick-enquiry-success-modal" class="modal-backdrop quick-enquiry-backdrop">
  <div class="modal-card success-popup-card">
    <div class="success-icon-badge">✅</div>
    <h3 class="success-popup-title">Thank You!</h3>
    <p class="success-popup-message">Your enquiry has been received successfully.<br>Our team will contact you shortly.</p>
    <button type="button" class="btn btn-primary btn-block" onclick="closeModal('quick-enquiry-success-modal')" style="min-height: 48px;">
      Close
    </button>
  </div>
</div>
