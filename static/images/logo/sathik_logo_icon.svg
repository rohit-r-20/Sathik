<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Luxury Gold Gradient -->
    <linearGradient id="sgGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Deep Navy Slate Gradient -->
    <linearGradient id="sgNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="sgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <!-- Inner Glow -->
    <linearGradient id="sgBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>

  <!-- Background Hexagon Shield -->
  <path d="M60 4 L110 32 L110 88 L60 116 L10 88 L10 32 Z" 
        fill="url(#sgNavyGrad)" 
        stroke="url(#sgBorderGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#sgShadow)" />

  <!-- Inner Geometric Framing -->
  <path d="M60 12 L102 36 L102 84 L60 108 L18 84 L18 36 Z" 
        fill="none" 
        stroke="rgba(253, 230, 138, 0.25)" 
        stroke-width="1.5" />

  <!-- Stylized Interlocking 'S' & 'G' Monogram Emblem -->
  <!-- 'S' Top Arch & Middle Spine -->
  <path d="M78 35 C78 28 70 24 58 24 C44 24 35 30 35 40 C35 48 42 53 54 56 L64 59 C75 62 82 67 82 77 C82 89 71 96 56 96 C40 96 32 88 32 79" 
        fill="none" 
        stroke="url(#sgGoldGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 'G' Outer Enclosure & Crossbar -->
  <path d="M64 26 C82 28 92 40 92 60 C92 81 79 94 58 94" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4" 
        stroke-linecap="round" 
        opacity="0.85" />

  <path d="M92 60 L70 60" 
        fill="none" 
        stroke="url(#sgGoldGrad)" 
        stroke-width="6" 
        stroke-linecap="round" />

  <!-- Center Diamond Sparkle Point -->
  <polygon points="60,18 63,24 60,30 57,24" fill="#FCD34D" />
</svg>
