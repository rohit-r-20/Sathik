<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90" fill="none">
  <defs>
    <linearGradient id="fullGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="fullNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (scaled 72x72) -->
  <g transform="translate(10, 9) scale(0.6)">
    <!-- Hexagon -->
    <path d="M60 4 L110 32 L110 88 L60 116 L10 88 L10 32 Z" 
          fill="url(#fullNavyGrad)" 
          stroke="url(#fullGoldGrad)" 
          stroke-width="3.5" 
          stroke-linejoin="round"
          filter="url(#logoShadow)" />
    <!-- Inner lines -->
    <path d="M60 12 L102 36 L102 84 L60 108 L18 84 L18 36 Z" 
          fill="none" 
          stroke="rgba(253, 230, 138, 0.3)" 
          stroke-width="1.5" />
    <!-- S -->
    <path d="M78 35 C78 28 70 24 58 24 C44 24 35 30 35 40 C35 48 42 53 54 56 L64 59 C75 62 82 67 82 77 C82 89 71 96 56 96 C40 96 32 88 32 79" 
          fill="none" 
          stroke="url(#fullGoldGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- G -->
    <path d="M64 26 C82 28 92 40 92 60 C92 81 79 94 58 94" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="4" 
          stroke-linecap="round" 
          opacity="0.9" />
    <path d="M92 60 L70 60" 
          fill="none" 
          stroke="url(#fullGoldGrad)" 
          stroke-width="6" 
          stroke-linecap="round" />
    <polygon points="60,18 63,24 60,30 57,24" fill="#FCD34D" />
  </g>

  <!-- Typography: SATHIK GROUPS -->
  <text x="94" y="44" 
        font-family="'Cinzel', 'Plus Jakarta Sans', 'Segoe UI', serif" 
        font-size="27" 
        font-weight="800" 
        letter-spacing="2" 
        fill="#0F172A">SATHIK GROUPS</text>

  <!-- Subtitle Tagline -->
  <text x="96" y="66" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="10.5" 
        font-weight="700" 
        letter-spacing="2.8" 
        fill="#B45309">PREMIER BUILDING MATERIALS</text>

  <!-- Small accent gold bar -->
  <rect x="96" y="74" width="38" height="2.5" rx="1.25" fill="url(#fullGoldGrad)" />
  <circle cx="140" cy="75.25" r="1.5" fill="#D97706" />
</svg>
