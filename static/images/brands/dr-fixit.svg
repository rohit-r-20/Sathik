<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="100%" height="100%">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF100" />
      <stop offset="100%" stop-color="#FFDC00" />
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect x="4" y="4" width="312" height="92" rx="16" fill="url(#dfBg)" stroke="#004B93" stroke-width="4" />
  
  <!-- Dr. Fixit Mascot figure (Contractor with yellow hard hat & suit) -->
  <g transform="translate(18, 12)">
    <!-- Blue outer circle for mascot -->
    <circle cx="36" cy="38" r="32" fill="#004B93" />
    <!-- Yellow helmet -->
    <path d="M22 28 C22 16, 50 16, 50 28 Z" fill="#FFF100" />
    <rect x="18" y="27" width="36" height="4" rx="2" fill="#FFF100" />
    <!-- Face / skin -->
    <circle cx="36" cy="35" r="8" fill="#FED7AA" />
    <path d="M31 38 Q36 41 41 38" stroke="#1E293B" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <!-- Blue neck tie & collar -->
    <path d="M26 44 L46 44 L44 58 L28 58 Z" fill="#FFFFFF" />
    <polygon points="36,44 38,54 36,58 34,54" fill="#DC2626" />
    <!-- Blue jacket -->
    <path d="M20 54 Q36 46 52 54 L52 70 L20 70 Z" fill="#003366" />
  </g>

  <!-- Wordmark -->
  <text x="96" y="52" font-family="'Arial Black', 'Helvetica Black', sans-serif" font-size="34" font-weight="900" fill="#004B93" letter-spacing="-0.5">Dr. Fixit</text>
  
  <!-- Subtitle -->
  <rect x="96" y="62" width="204" height="20" rx="4" fill="#004B93" />
  <text x="198" y="76" font-family="'Arial', sans-serif" font-size="10.5" font-weight="800" fill="#FFF100" text-anchor="middle" letter-spacing="1.5">WATERPROOFING EXPERT</text>
</svg>