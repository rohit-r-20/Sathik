<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 82" width="100%" height="100%">
  <defs>
    <linearGradient id="sheenBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B66" />
      <stop offset="100%" stop-color="#081B44" />
    </linearGradient>
    <linearGradient id="sheenRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Arched Premium Banner Ribbon -->
  <path d="M 8 10 L 242 10 C 242 10, 238 52, 238 54 C 180 46, 70 46, 12 54 C 12 52, 8 10, 8 10 Z" 
        fill="url(#sheenBlue)" filter="url(#dropShadow)" />
  
  <!-- Subtle Silver Border highlight on banner bottom -->
  <path d="M 12 53 C 70 45, 180 45, 238 53" 
        stroke="#E2E8F0" stroke-width="2" fill="none" />

  <!-- Bold Crisp SHEENLAC Lettering -->
  <text x="125" y="41" font-family="'Arial Black', 'Montserrat', Impact, sans-serif" 
        font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SHEENLAC</text>

  <!-- PAINTS Subtitle with Accent Dots -->
  <g transform="translate(125, 71)">
    <circle cx="-62" cy="-5" r="3" fill="#EAB308" />
    <text x="0" y="0" font-family="'Arial', sans-serif" 
          font-size="14" font-weight="900" fill="#1E3A8A" text-anchor="middle" letter-spacing="7">PAINTS</text>
    <circle cx="62" cy="-5" r="3" fill="#EAB308" />
  </g>
</svg>