      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>
  <!-- Oval badge -->
  <ellipse cx="140" cy="45" rx="132" ry="38" fill="url(#linkRed)" stroke="#FEF08A" stroke-width="3.5" />
  <ellipse cx="140" cy="45" rx="126" ry="32" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
  
